name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
      - main
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease

          KEYSTORE_PATH="release.keystore"
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK_DIR=$(dirname $APK)

          echo "Signing APKs in $APK_DIR..."
          for apk in "$APK_DIR"/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              signed_apk="${apk%-unsigned.apk}-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:ownbox123 --key-pass pass:ownbox123 --ks-key-alias ownbox --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done

          echo "APK=$APK_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Version
        run: |
          PRE_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "PRE_VERSION=$PRE_VERSION" >> $GITHUB_ENV
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PRE_VERSION }}
          name: OwnBox v${{ env.PRE_VERSION }}
          body: |
            ## OwnBox v${{ env.PRE_VERSION }}

            ### 核心更新与修复
            - **路由规则修复**：彻底修复中国大陆域名与中国 IP 规则并存时导致的绕过/直连失效问题，自动分流分拆，无需且严禁写死包名。
            - **实时路由状态显示**：在规则列表右侧实时显示连接数、实时速率及实际出网节点/策略组（点击可直达实时流量连接监控面板）。
            - **策略组全面升级**：
              - 升级“负载均衡”为“策略组”，支持 5 种底层真实调度策略：最低延迟 (leastPing)、故障转移 (failover)、随机 (random)、负载均衡 (round_robin)、最稳定 (stable)。
              - 策略组配置支持多选节点器（支持批量添加、去重与防循环引用校验）。
            - **内核与协议**：保持 sing-box v1.15.0-alpha.6 官方内核稳定运行，适配 Sing-Tun 协议栈。
          files: apks/*.apk
          draft: false
          prerelease: true
          make_latest: false
