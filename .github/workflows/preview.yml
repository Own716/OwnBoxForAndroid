name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
      - main
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease

          KEYSTORE_PATH="release.keystore"
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK_DIR=$(dirname $APK)

          echo "Signing APKs in $APK_DIR..."
          for apk in "$APK_DIR"/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              signed_apk="${apk%-unsigned.apk}-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:ownbox123 --key-pass pass:ownbox123 --ks-key-alias ownbox --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done

          echo "APK=$APK_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Version
        run: |
          PRE_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "PRE_VERSION=$PRE_VERSION" >> $GITHUB_ENV
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PRE_VERSION }}
          name: OwnBox v${{ env.PRE_VERSION }}
          body: |
            ## OwnBox v${{ env.PRE_VERSION }}

            ### 核心更新与修复
            - **移除活跃链接冗余模块**：清理多余的活跃链接监控卡片与列表，精简保留轻量纯粹的实时流量速率图表；路由页面中暂无活动连接的规则彻底隐藏状态栏，有活跃连接时精确显示走向与目标（如：`走向: 微信 (szextshort.weixin.qq.com:443) → 直连 (2条连接)`）。
            - **秒级高可用落地 IP 探测**：重构落地 IP 探测机制，经由 SOCKS5 本地入站直连核心代理，结合 5 路并发竞速（Cloudflare Trace、Ipify、IPWhois、IP.sb、IP-API）实现毫秒级即时反馈；彻底解决部分节点下落地 IP 消失问题，空状态下兜底展示节点区域标识（如 `🇺🇸 US (点击重试)`）并支持点击就地重新测速与刷新，底栏落地 IP 永不空白。
            - **策略组功能强化与后台省电优化**：全面支持 4 项调度策略（最低延迟 leastPing、最低负载 leastLoad、随机选择 random、轮询 roundRobin），并在息屏（`ACTION_SCREEN_OFF`）时自动暂停后台周期性测速探针，大幅降低后台功耗与流量消耗，亮屏即刻唤醒恢复。
            - **修复微信发图片/文件卡死转圈**：修复禁用 IPv6 时 Android TUN 虚拟网卡错误配置 IPv6 路由导致的 Mars 双栈握手黑洞；补充微信及腾讯核心直连域名解析与直连出站规则，保障微信图片、视频与文件秒发秒收。
            - **内核与协议**：搭载 sing-box v1.15.0-alpha.6 官方内核稳定运行，深度适配 Sing-Tun 协议栈。
          files: apks/*.apk
          draft: false
          prerelease: true
          make_latest: false
