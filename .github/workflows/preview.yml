name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
      - main
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease

          KEYSTORE_PATH="release.keystore"
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK_DIR=$(dirname $APK)

          echo "Signing APKs in $APK_DIR..."
          for apk in "$APK_DIR"/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              signed_apk="${apk%-unsigned.apk}-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:ownbox123 --key-pass pass:ownbox123 --ks-key-alias ownbox --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done

          echo "APK=$APK_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Version
        run: |
          PRE_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "PRE_VERSION=$PRE_VERSION" >> $GITHUB_ENV
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PRE_VERSION }}
          name: OwnBox v${{ env.PRE_VERSION }}
          body: |
            ## OwnBox v${{ env.PRE_VERSION }}

            ### 网络工具三大功能全面重构
            - **IP 纯净度检测重构**：接入双权威情报数据库（`ip-api.com` + `api.ipapi.is`）与三态证据模型，实现多维证据评分（住宅属性、机房概率、代理/VPN、滥用记录、爬虫倾向、置信度），引入双源冲突从严判定与可信度惩罚机制；打造现代化卡片 UI，新增综合评分环、人机流量特征比例预估及多场景适用性矩阵。
            - **流媒体解锁检测重构**：彻底废弃“网页能打开即解锁”的误判逻辑；引入 Anthropic 官方区域白名单与严格限制（严格拦截中国香港 HK、中国大陆 CN 等不支持区域，杜绝虚假支持）；Netflix 深度识别非自制版权库区分原生全解锁与仅自制剧；并发限制为 2~3 个防止触发 Cloudflare 429 防爬风控，并支持节点切换实时取消。
            - **连通性测试三阶段重构**：打造「入口物理可达性 → 核心代理出站隧道 → 6 大目标真实 HTTPS 探测（含 Google 送中检测）」端到端流水线；内置网络丢包与瞬时抖动自动重试恢复机制，输出准确的节点可用性综合评估结论（可正常使用 / 部分可用 / 不可用）。
            - **内核与协议**：搭载 sing-box v1.15.0-alpha.6 官方内核稳定运行。
          files: apks/*.apk
          draft: false
          prerelease: true
          make_latest: false
